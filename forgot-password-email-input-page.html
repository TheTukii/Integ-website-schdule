<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/includes/css/login-page-css.css">
    <title>Forgot Password</title>
</head>

<body>

    <div class="Inner">
        <div class="card-login">

            <div class="text-center">

                <img class="login-logo" src="/includes/img/Logov2.png">

                <h3 style="color:#042C53; margin-bottom: 1.5rem;">
                    Forgot Password
                </h3>

                <p style="font-size: 0.9rem; color: gray; margin-bottom: 1rem;">
                    Enter your email to receive a reset code
                </p>

                <form action="code-input-page.html">

                    <input type="email" class="input-email mb-4" placeholder="Email">

                    <button type="submit" class="btn btn-primary" style="width: 12rem;">
                        Send Code
                    </button>

                </form>

            </div>

        </div>
    </div>

</div>

</body>
</html>
