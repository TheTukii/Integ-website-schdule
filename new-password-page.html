<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/includes/css/login-page-css.css">
    <title>New Password</title>
</head>

<body>

    <div class="Inner">
        <div class="card-login">

            <div class="text-center">

                <img class="login-logo" src="/includes/img/Logov2.png">

                <h3 style="color:#042C53; margin-bottom: 1rem;">
                    New Password
                </h3>

                <p style="font-size: 0.95rem; color: gray; margin-bottom: 1.5rem; max-width: 18rem;">
                    Enter your new password below and confirm it to complete the reset process.
                </p>

                <form action="login-page.html">

                    <input type="password" class="input-password mb-3" placeholder="New Password">

                    <input type="password" class="input-password mb-4" placeholder="Confirm Password">

                    <button type="submit" class="btn btn-success" style="width: 12rem;">
                        Reset Password
                    </button>

                </form>

            </div>

        </div>
    </div>

</body>

</body>
</html>
