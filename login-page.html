<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BukSU — Classroom Finder · Log In</title>
  <meta name="description" content="Log in to BukSU Classroom Finder to check room availability, view schedules, and reserve classrooms.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/includes/css/login-page-css.css">
</head>
<body>

<div class="page-container">

  <!-- LEFT — HERO PANEL -->
  <div class="card-side">
    <div>
      <img class="welcome-image" src="/includes/img/Welcome_Classroom.png" alt="BukSU Campus">
    </div>
    <div class="hero-content">
      <div class="hero-brand">
        <div class="logo-mark">Bu</div>
        <span>BukSU Rooms</span>
      </div>
      <h1 class="hero-title">Find your classroom,<br>right on campus.</h1>
      <p class="hero-subtitle">Check real-time room availability, view your daily schedule, and reserve spaces — all in one place.</p>
    </div>
  </div>

  <!-- RIGHT — LOGIN FORM -->
  <div class="Inner">
    <div class="card-login">
      <div>

        <div class="text-center">
          <img class="login-logo" src="/includes/img/Logov2.png" alt="BukSU Logo">
        </div>

        <h2 class="login-heading">Welcome back</h2>
        <p class="login-sub">Sign in to your account to continue</p>

        <!-- FORM -->
        <form id="loginForm">

          <div class="input-group">
            <label for="email">Email</label>
            <input type="text" id="email" class="input-email" placeholder="you@buksu.edu.ph">
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="input-password" placeholder="Enter your password">
          </div>

          <div class="forgot-row">
            <a href="forgot-password-email-input-page.html">Forgot password?</a>
          </div>

          <div class="btn-group">
            <button type="submit" class="btn-login" id="loginBtn">
              <i class="bi bi-box-arrow-in-right"></i>
              Log in
            </button>

            <div class="separator"><span>or</span></div>

            <a href="register-page.html" class="btn-register" id="registerBtn">
              <i class="bi bi-person-plus"></i>
              Create an account
            </a>
          </div>

        </form>

      </div>
    </div>
  </div>

</div>

<!-- TRANSITION + VALIDATION SCRIPT -->
<script>
// Smooth page-exit transition helper
function navigateTo(url) {
    document.body.classList.add('page-exit');
    setTimeout(function() {
        window.location.href = url;
    }, 280);
}

// Intercept all anchor links for smooth transition
document.querySelectorAll('a[href]').forEach(function(link) {
    link.addEventListener('click', function(e) {
        const href = this.getAttribute('href');
        if (href && !href.startsWith('#') && !href.startsWith('javascript')) {
            e.preventDefault();
            navigateTo(href);
        }
    });
});

// Form validation + transition
document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value.trim();

    if (email === "" || password === "") {
        alert("Please fill in both email and password!");
        return;
    }

    // if valid → smooth transition to dashboard
    navigateTo("user-dashboard.html");
});
</script>

</body>
</html>
