<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/includes/css/login-page-css.css">
    <title>Register</title>
</head>

<body>


    <div class="Inner">
        <div class="card-login">

            <div>


                <div class="text-center">
                    <img class="login-logo" src="/includes/img/Logov2.png" alt="Logo">
                </div>


                <div class="text-center">
                    <h3 style="color:#042C53; margin-bottom: 1.5rem;">Register</h3>
                </div>


                <form action="login-page.html" method="GET">

                    <div class="text-center">

                        <input type="text" class="input-email mb-3" placeholder="Email">

                        <input type="text" class="input-password mb-3" placeholder="Password">

                        <input type="text" class="input-password mb-4" placeholder="Confirm Password">


                        <button type="submit" class="btn btn-primary mb-2" style="width: 12rem;">
                            Register
                        </button>


                        <a href="login-page.html" class="btn btn-outline-success" style="width: 12rem;">
                            Back to Login
                        </a>

                    </div>

                </form>

            </div>

        </div>
    </div>

</div>

</body>
</html>
