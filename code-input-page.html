<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/includes/css/login-page-css.css">
    <title>Enter Code</title>
</head>

<body>

    <div class="Inner">
        <div class="card-login">

            <div class="text-center">

                <img class="login-logo" src="/includes/img/Logov2.png">

                <h3 style="color:#042C53; margin-bottom: 1.5rem;">
                    Enter Code
                </h3>

                <p style="font-size: 0.9rem; color: gray;">
                    We sent a code to your email
                </p>

                <form action="./new-password-page.html">

                    <input type="text" class="input-email mb-4" placeholder="6-digit code">

                    <button type="submit" class="btn btn-primary" style="width: 12rem;">
                        Verify
                    </button>

                </form>

            </div>

        </div>
    </div>

</body>
</html>
